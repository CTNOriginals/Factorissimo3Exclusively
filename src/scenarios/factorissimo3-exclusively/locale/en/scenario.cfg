scenario-name=Factorissimo 3 Exclusively
description=Play the whole game inside a single Factorissimo factory building, with nothing else in the world.\nResources come in through the constant combinators in the void behind the gaps in the factory walls: set an allowed ore or fluid in the first slot and it is fed into the belt or pipe in front of it.

[message]
intro=Welcome to Factorissimo 3 Exclusively. This factory is all there is.\nResources come in through the constant combinators in the void behind the gaps in the walls: set an ore or fluid in the first slot and it is fed into the belt or pipe in front of it.
spawn-surface-missing=Spawn surface "__1__" not found, check the spawn in shared/config.lua.
