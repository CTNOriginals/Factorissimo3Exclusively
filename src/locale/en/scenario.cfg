scenario-name=Factorissimo 3 Exclusively
description=Play the whole game inside a single Factorissimo factory building, with nothing else in the world.\nResources come in through the constant combinators in the void behind the gaps in the factory walls: open one, pick an ore or fluid and it is fed into the belt or pipe in front of it.

